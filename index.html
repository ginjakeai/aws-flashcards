<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CLF単語帳">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>CLF単語帳</title>
<style>
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface-2:#EEEAE2; --ink:#1D1F24; --ink-2:#575B64; --ink-3:#8B8F97;
  --line:#E3DED4; --accent:#D2600E; --accent-ink:#FFFFFF; --accent-soft:#FBE6D4;
  --ok:#2E8A57; --ok-soft:#DCF0E3; --ng:#C0403A; --ng-soft:#F7DFDD; --mid:#D99A1E;
  --shadow:0 1px 2px rgba(40,30,15,.05),0 10px 28px rgba(40,30,15,.07);
  --r:18px;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121417; --surface:#1B1E23; --surface-2:#252930; --ink:#ECEDEF; --ink-2:#A8ADB5; --ink-3:#787E87;
    --line:#2D3239; --accent:#F08A3C; --accent-ink:#1E1205; --accent-soft:#3A2512;
    --ok:#4DC386; --ok-soft:#163426; --ng:#F2736A; --ng-soft:#3E1D1B; --mid:#E7B44A;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.top h1{margin:0;font-size:1.5rem;letter-spacing:.02em;font-weight:800}
.top .sub{color:var(--ink-3);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
@media (prefers-color-scheme:light){.card{border-color:transparent}}
.card h2{margin:0 0 12px;font-size:.95rem;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.muted{color:var(--ink-3)} .center{text-align:center}
.note{color:var(--ink-3);font-size:.8rem;margin:10px 0 0;line-height:1.55}

/* summary */
.sum-main{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sum-big{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum-big small{font-size:1rem;color:var(--ink-3);font-weight:600;margin-left:4px}
.sum-label{color:var(--ink-2);font-size:.8rem;margin-top:6px}
.sum-today{text-align:right}
.sum-today b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.sum-today span{font-size:.75rem;color:var(--ink-3)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:16px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--c)}
.c-ok{--c:var(--ok);background:var(--ok)} .c-mid{--c:var(--mid);background:var(--mid)} .c-new{--c:var(--surface-2);background:var(--surface-2)}
.legend .c-new::before{background:var(--ink-3);opacity:.35}

/* settings rows */
.row{margin-bottom:14px} .row:last-child{margin-bottom:0}
.row-label{font-size:.78rem;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:.85rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.seg button.on{background:#3A3F48}}
.pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;text-align:left}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pick em{font-style:normal;color:var(--ink-3);font-size:.85rem;flex:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:1rem;margin-top:10px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--ng);border:1px solid var(--ng-soft)}
.btn.small{padding:11px 14px;font-size:.9rem}
.btn:active{transform:scale(.985)}
.start-meta{font-size:.78rem;color:var(--ink-3);text-align:center;margin-top:8px}

/* category progress */
.cats{list-style:none;margin:0;padding:0}
.cats li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:0;background:transparent;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.cats li:first-child button{border-top:0;padding-top:2px}
.cats .nm{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats .ct{font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cats .mini{grid-column:1/-1;display:flex;height:5px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.cats .mini i{height:100%;display:block}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#tabs .in{display:flex;width:100%;max-width:560px}
#tabs button{flex:1;border:0;background:transparent;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--ink-3)}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--accent)}

/* list */
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .seg{margin-top:8px}
.count{font-size:.78rem;color:var(--ink-3);margin:2px 2px 8px}
.items{list-style:none;margin:0;padding:0}
.items li{background:var(--surface);border-radius:14px;margin-bottom:8px;border:1px solid var(--line)}
@media (prefers-color-scheme:light){.items li{border-color:transparent;box-shadow:0 1px 2px rgba(40,30,15,.05)}}
.items details summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.items details summary::-webkit-details-marker{display:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-3);opacity:.35}
.dot.ok{background:var(--ok);opacity:1} .dot.mid{background:var(--mid);opacity:1}
.items .t{flex:1;min-width:0}
.items .t b{display:block;font-size:.95rem;word-break:break-word}
.items .t small{color:var(--ink-3);font-size:.72rem}
.items .d{padding:0 14px 14px 33px;color:var(--ink-2);font-size:.9rem}
.empty{text-align:center;color:var(--ink-3);padding:40px 0}

/* data */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:4px 0}
.kv span{color:var(--ink-3)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ok-text{color:var(--ok)} .ng-text{color:var(--ng)}
.ver{text-align:center;color:var(--ink-3);font-size:.72rem;margin:18px 0 0}

/* sheet (category picker) */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86vh;max-height:86dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-head h3{margin:0;font-size:1.05rem}
.sheet-head button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:1rem;padding:6px}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:.85rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.chip i{font-style:normal;color:var(--ink-3);margin-left:4px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on i{color:var(--accent-ink);opacity:.8}
.chip.zero{opacity:.4}
.chip-head{width:100%;font-size:.75rem;color:var(--ink-3);font-weight:700;margin:14px 0 0}
.chip-head:first-child{margin-top:0}
.sheet-tabs{margin:2px 18px 4px}
.sheet-hint{font-size:.75rem;color:var(--ink-3);margin:6px 18px 8px}
.stat-seg{margin:-2px 0 12px}
.ed-link{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:.8rem;padding:6px 0 6px 12px;margin:-6px 0}
.d .ed-link{display:block;margin:6px 0 -6px auto;padding:6px 0}
.add-btn{margin:0 0 10px}
.ed label{display:block;font-size:.78rem;color:var(--ink-3);font-weight:600;margin-bottom:12px}
.ed input,.ed textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);outline:none;font-weight:400;line-height:1.5}
.ed textarea{resize:vertical;min-height:96px}
.ed input:focus,.ed textarea:focus{border-color:var(--accent)}
.ed-err{color:var(--ng);font-size:.85rem;font-weight:600;margin:0;min-height:1em}
.ed-foot{display:flex;gap:10px}
.ed-foot .btn{margin:0}
.ed-foot .danger{flex:0 0 30%}
.f-topic{font-size:.75rem;color:var(--ink-3);margin-top:10px;font-weight:600}
.sheet-foot{padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{margin:0}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.6}}

/* study */
#study{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.s-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px 12px 6px;max-width:560px;width:100%;margin:0 auto}
.icon{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.icon svg{width:22px;height:22px}
.icon:disabled{opacity:.25}
.s-prog{text-align:center}
.s-count{font-size:.8rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .25s ease}
.s-body{flex:1;overflow-y:auto;padding:8px 16px 12px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.flash{position:relative;flex:1;min-height:320px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
@media (prefers-color-scheme:light){.flash{border-color:transparent}}
.flash.anim{transition:transform .22s ease,opacity .22s ease}
.f-meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:99px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-size:.72rem;color:var(--ink-3);font-weight:600;white-space:nowrap}
.f-q-label,.f-a-label{font-size:.75rem;color:var(--ink-3);font-weight:600;margin-top:22px}
.f-q{margin-top:6px;word-break:break-word}
.is-name{font-size:1.55rem;font-weight:800;line-height:1.35;letter-spacing:.01em}
.is-desc{font-size:1.08rem;font-weight:500;line-height:1.75}
.f-a{margin-top:auto;padding-top:18px}
.flash.revealed .f-a{border-top:1px dashed var(--line);margin-top:22px}
.f-a .is-name,.f-a .is-desc{margin-top:6px;word-break:break-word}
.f-hint{text-align:center;color:var(--ink-3);font-size:.85rem;padding:10px 0}
.stamp{position:absolute;top:18px;padding:4px 12px;border-radius:10px;font-weight:800;font-size:1rem;opacity:0;border:2px solid;pointer-events:none}
.stamp.ok{right:18px;color:var(--ok);border-color:var(--ok);transform:rotate(8deg)}
.stamp.ng{left:18px;color:var(--ng);border-color:var(--ng);transform:rotate(-8deg)}
.swipe-hint{text-align:center;font-size:.72rem;color:var(--ink-3);margin-top:10px}
.s-actions{display:flex;gap:10px;padding:8px 16px 14px;max-width:560px;width:100%;margin:0 auto}
.s-actions .btn{margin:0}
.btn.ok{background:var(--ok);color:#fff} .btn.ng{background:var(--ng);color:#fff}
@media (prefers-color-scheme:dark){.btn.ok,.btn.ng{color:#0f1112}}
.result .res-num{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}
.result .res-num div{background:var(--surface);border-radius:18px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.result .res-num b{display:block;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.result .res-num span{font-size:.78rem;color:var(--ink-3)}
.result .res-num div:first-child b{color:var(--ok)} .result .res-num div:last-child b{color:var(--ng)}
.result h3{font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.res-list{list-style:none;margin:0;padding:0}
.res-list li{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.res-list b{display:block;font-size:.95rem}
.res-list span{font-size:.85rem;color:var(--ink-2)}
.s-actions.col{flex-direction:column}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:all .2s ease;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:80px 0;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>
<main class="wrap" id="view"><div class="loading">読み込み中…</div></main>

<nav id="tabs" aria-label="メニュー"><div class="in">
  <button data-act="tab" data-v="study" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>学習</button>
  <button data-act="tab" data-v="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>単語一覧</button>
  <button data-act="tab" data-v="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>データ</button>
</div></nav>

<section id="study" hidden></section>
<div id="sheet" hidden></div>
<div id="editor" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const VERSION = '1.2.0';
const CACHE_NAME = 'clf-cards-v3';
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];   // 箱ごとの次回出題までの日数
const MASTER = 3;                              // この箱以上を「習得」とみなす
const K = { progress:'clf.progress.v1', settings:'clf.settings.v1', custom:'clf.customDeck.v1', hint:'clf.hint.v1' };

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- state ---------- */
const AXES = [['cat', '分類'], ['chap', '章'], ['topic', 'トピック']];
let deck = [], deckMap = new Map(), deckLabel = '', loadError = '';
let groups = { cat:[], chap:[], topic:[] };
let progress = store.get(K.progress, {}) || {};
let settings = Object.assign({ dir:'n2d', size:20, order:'book', statAxis:'cat' }, store.get(K.settings, {}) || {});
settings.filter = Object.assign({ cat:[], chap:[], topic:[] }, settings.filter || {});
if(Array.isArray(settings.cats)){ if(!settings.filter.cat.length) settings.filter.cat = settings.cats; delete settings.cats; }
const axisOn = k => groups[k].length > 0;
let tab = 'study';
let listState = { q:'', st:'all' };
let S = null;          // study session
let sheetF = null, sheetAxis = 'cat';  // range selection being edited

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const saveProgress = () => { if(!store.set(K.progress, progress)) toast('記録を保存できませんでした'); };
const saveSettings = () => store.set(K.settings, settings);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/, '');
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    }else if(c === '"') q = true;
    else if(c === ',') { row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    }else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const COLS = {
  name: /^(名称|名前|用語|単語|name|term)$/i,
  cat: /^(分類|カテゴリ|category)$/i,
  desc: /^(説明文|説明|意味|description|definition)$/i,
  chap: /^(章|chapter)$/i,
  topic: /^(トピック|節|topic|section)$/i
};
function csvToDeck(text){
  let rows = parseCSV(text).map(r => r.map(s => s.trim())).filter(r => r.some(Boolean));
  if(!rows.length) throw new Error('空のファイルです');
  let idx = null;
  if(rows[0].some(h => COLS.name.test(h))){
    idx = {};
    for(const k in COLS){ const i = rows[0].findIndex(h => COLS[k].test(h)); if(i >= 0) idx[k] = i; }
    rows = rows.slice(1);
    if(idx.name == null || idx.desc == null) throw new Error('「名称」と「説明文」の列が見つかりません');
  }
  const seen = new Set(), out = [];
  for(const r of rows){
    let w;
    if(idx){
      const g = k => idx[k] == null ? '' : (r[idx[k]] || '');
      w = { name:g('name'), cat:g('cat'), desc:g('desc'), chap:g('chap'), topic:g('topic') };
    }else if(r.length >= 3) w = { name:r[0], cat:r[1], desc:r[2], chap:r[3] || '', topic:r[4] || '' };
    else if(r.length === 2) w = { name:r[0], cat:'', desc:r[1], chap:'', topic:'' };
    else continue;
    if(!w.name || !w.desc || seen.has(w.name)) continue;
    seen.add(w.name);
    w.cat = w.cat || '未分類';
    out.push(w);
  }
  if(!out.length) throw new Error('読み込める行がありませんでした（名称・分類・説明文の列が必要です）');
  return out;
}
function setDeck(list, label){
  deck = list; deckLabel = label;
  deckMap = new Map(deck.map(w => [w.name, w]));
  for(const [k] of AXES){
    const seen = new Set(); groups[k] = [];
    for(const w of deck) if(w[k] && !seen.has(w[k])){ seen.add(w[k]); groups[k].push(w[k]); }
    settings.filter[k] = (settings.filter[k] || []).filter(v => seen.has(v));
  }
  if(!axisOn(settings.statAxis)) settings.statAxis = 'cat';
}
async function loadDeck(){
  const custom = store.get(K.custom, null);
  if(custom && custom.text){
    try{ setDeck(csvToDeck(custom.text), custom.label || '読み込んだCSV'); return; }
    catch(e){ store.del(K.custom); }
  }
  try{
    const res = await fetch('words.csv');
    if(!res.ok) throw new Error(res.status);
    setDeck(csvToDeck(await res.text()), 'AWS CLF 単語リスト');
  }catch(e){
    loadError = '単語データを読み込めませんでした。一度、通信できる状態で開き直してください。';
  }
}

/* ---------- learning logic ---------- */
const rec = name => progress[name];
function statusOf(name){ const r = rec(name); return !r ? 'new' : (r.b >= MASTER ? 'ok' : 'mid'); }
function isDue(name, now){ const r = rec(name); return !!r && r.d <= now; }
function matches(w, f){
  for(const [k] of AXES){ const s = f[k]; if(s && s.length && !s.includes(w[k])) return false; }
  return true;
}
function inScope(w){ return matches(w, settings.filter); }

function plan(pool, size){
  const now = Date.now();
  const due = shuffle(pool.filter(w => isDue(w.name, now))).sort((a,b) => rec(a.name).b - rec(b.name).b);
  const fresh = pool.filter(w => !rec(w.name)); if(settings.order === 'random') shuffle(fresh);
  const later = pool.filter(w => rec(w.name) && !isDue(w.name, now)).sort((a,b) => (rec(a.name).b - rec(b.name).b) || (rec(a.name).d - rec(b.name).d));
  const n = size === 0 ? pool.length : Math.min(size, pool.length);
  const picked = [...due, ...fresh, ...later].slice(0, n);
  const nDue = Math.min(due.length, n), nFresh = Math.min(fresh.length, n - nDue);
  return { picked, nDue, nFresh, nLater: picked.length - nDue - nFresh };
}
function startSession(words){
  if(!words.length){ toast('出題できる用語がありません'); return; }
  S = {
    queue: words.map(w => ({ name: w.name, dir: settings.dir === 'mix' ? (Math.random() < .5 ? 'n2d' : 'd2n') : settings.dir, re: 0 })),
    i: 0, revealed: false, failed: [], history: [], unique: words.length
  };
  $('#study').hidden = false; document.body.style.overflow = 'hidden';
  renderStudy();
}
function endSession(){ S = null; $('#study').hidden = true; document.body.style.overflow = ''; render(); }

function answer(ok){
  if(!S || !S.revealed) return;
  const card = S.queue[S.i], name = card.name, now = Date.now();
  S.history.push({ snap: JSON.stringify({ queue:S.queue, i:S.i, failed:S.failed }), name, rec: rec(name) ? { ...rec(name) } : null });
  if(S.history.length > 50) S.history.shift();
  const prev = rec(name), wasDue = !prev || prev.d <= now;
  const r = prev ? { ...prev } : { b:0, d:0, n:0, ok:0, ng:0 };
  r.n++; r.l = now;
  if(ok){
    r.ok++;
    if(S.failed.includes(name)) r.b = 1;
    else if(wasDue) r.b = Math.min(r.b + 1, INTERVALS.length - 1);
    else r.b = Math.max(r.b, 1);
    r.d = Math.max(wasDue ? 0 : r.d, startOfDay(now) + INTERVALS[r.b] * DAY);
  }else{
    r.ng++; r.b = 0; r.d = now;
    if(!S.failed.includes(name)) S.failed.push(name);
    if(card.re < 3){ const pos = Math.min(S.i + 4, S.queue.length); S.queue.splice(pos, 0, { ...card, re: card.re + 1 }); }
  }
  progress[name] = r; saveProgress();
  S.i++; S.revealed = false;
  renderStudy();
}
function undo(){
  if(!S || !S.history.length) return;
  const h = S.history.pop(), snap = JSON.parse(h.snap);
  S.queue = snap.queue; S.i = snap.i; S.failed = snap.failed; S.revealed = true;
  if(h.rec) progress[h.name] = h.rec; else delete progress[h.name];
  saveProgress(); renderStudy();
}

/* ---------- views ---------- */
function stats(list){
  let ok = 0, mid = 0, nw = 0, due = 0; const now = Date.now();
  for(const w of list){ const s = statusOf(w.name); if(s === 'ok') ok++; else if(s === 'mid') mid++; else nw++; if(isDue(w.name, now)) due++; }
  return { ok, mid, nw, due, total: list.length };
}
const pct = (a, b) => b ? (a / b * 100).toFixed(2) + '%' : '0%';
function stackBar(s, cls = 'stack'){
  return `<div class="${cls}"><i class="c-ok" style="width:${pct(s.ok,s.total)}"></i><i class="c-mid" style="width:${pct(s.mid,s.total)}"></i></div>`;
}
function seg(key, opts){
  return `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-act="set" data-k="${key}" data-v="${v}" class="${String(settings[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
const QUICK_NAMES = { cust:'顧客の責任', aws:'AWSの責任', type:'サービスの型', idea:'概念' };
const shortOf = (k, v) => k === 'cat' ? v : v.split(' ')[0];
function axisLabel(k, sel){
  if(k === 'cat' && sel.length > 1){
    const cur = sel.slice().sort().join('\n');
    for(const q in QUICK_NAMES){ if(groups.cat.filter(QUICK[q]).sort().join('\n') === cur) return QUICK_NAMES[q]; }
  }
  if(sel.length === 1) return k === 'topic' ? sel[0] : shortOf(k, sel[0]);
  if(k !== 'cat' && sel.length <= 3) return sel.map(v => shortOf(k, v)).join('・');
  return `${shortOf(k, sel[0])} ほか${sel.length - 1}件`;
}
function scopeLabel(){
  const parts = AXES.filter(([k]) => settings.filter[k].length).map(([k]) => axisLabel(k, settings.filter[k]));
  return parts.length ? parts.join(' × ') : 'すべて';
}

    <div class="row"><div class="row-label">範囲</div><button class="pick" data-act="cats-open"><span>${esc(scopeLabel())}</span><em>${pool.length}語 ›</em></button></div>

    <button class="btn primary" data-act="start" ${p.picked.length ? '' : 'disabled'}>学習をはじめる（${p.picked.length}枚）</button>

    <ul class="cats">${catRows}</ul>
  </section>`;
}

async function checkOffline(){
  const el = $('#offline'); if(!el) return;
  if(!('serviceWorker' in navigator) || !window.caches){ el.textContent = 'このブラウザはオフライン起動に対応していません'; return; }
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const hit = await caches.match('words.csv', { ignoreSearch:true });
    if(reg && reg.active && hit){ el.innerHTML = '<span class="ok-text">準備完了：通信なしでも起動できます</span>'; }
    else el.textContent = '準備中です。少し待ってから開き直してください';
  }catch(e){ el.textContent = '確認できませんでした'; }
}

  if(tab === 'study') v.innerHTML = homeHTML();

/* ---------- study screen ---------- */
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>';

function renderStudy(){
  const el = $('#study');
  if(S.i >= S.queue.length){ el.innerHTML = resultHTML(); return; }
  const c = S.queue[S.i], w = deckMap.get(c.name);
  if(!w){ S.i++; renderStudy(); return; }
  const r = rec(c.name);
  const lv = !r ? '初見' : (S.failed.includes(c.name) ? 'やり直し' : `レベル ${r.b}`);

    <div class="s-prog"><div class="s-count">${S.i + 1} / ${S.queue.length}</div><div class="bar"><i style="width:${pct(S.i, S.queue.length)}"></i></div></div>
    <button class="icon" data-act="undo" aria-label="ひとつ戻す" ${S.history.length ? '' : 'disabled'}>${ICON_UNDO}</button>

  <div class="s-body">

        : `<div class="f-hint">タップで答えを表示</div>`}</div>

function resultHTML(){

function bindSwipe(){
  const card = $('#flash'); if(!card || !S.revealed) return;
  let x0 = 0, y0 = 0, dx = 0, active = false, horiz = null;
  const okS = card.querySelector('.stamp.ok'), ngS = card.querySelector('.stamp.ng');
  card.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; active = true; horiz = null; card.classList.remove('anim'); }, { passive:true });
  card.addEventListener('touchmove', e => {
    if(!active) return;
    const t = e.touches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if(horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy);
    if(!horiz) return;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    okS.style.opacity = Math.max(0, Math.min(1, dx / 90)); ngS.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  }, { passive:true });
  card.addEventListener('touchend', () => {
    if(!active) return; active = false;
    card.classList.add('anim');
    if(horiz && Math.abs(dx) > 90){
      const ok = dx > 0;
      card.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 14 : -14}deg)`; card.style.opacity = '0';
      store.set(K.hint, true);
      setTimeout(() => answer(ok), 180);
    }else{ card.style.transform = ''; okS.style.opacity = 0; ngS.style.opacity = 0; }
  });
}

/* ---------- range sheet（分類 × 章 × トピック） ---------- */
const QUICK = {
  cust: c => c.startsWith('顧客：') || /型（/.test(c),
  aws:  c => c.startsWith('AWS：'),
  type: c => /型（/.test(c),
  idea: c => c === '概念'
};
const emptyFilter = () => ({ cat:[], chap:[], topic:[] });
function openSheet(){
  sheetF = { cat:[...settings.filter.cat], chap:[...settings.filter.chap], topic:[...settings.filter.topic] };
  if(!axisOn(sheetAxis)) sheetAxis = 'cat';
  $('#sheet').innerHTML = `
  <div class="overlay" data-act="sheet-bg"><div class="sheet" role="dialog" aria-label="出題範囲">
    <div class="sheet-head"><h3>出題範囲</h3><button data-act="sheet-clear">クリア</button></div>
    <div class="seg sheet-tabs" id="sheetTabs"></div>
    <p class="sheet-hint">分類・章・トピックで選んだ条件は、組み合わせて絞り込みます（例：第3章 × 顧客の責任）</p>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div></div>`;
  $('#sheet').hidden = false;
  renderSheet(true);
}
function closeSheet(apply){
  if(apply){
    for(const [k] of AXES) settings.filter[k] = sheetF[k].length === groups[k].length ? [] : sheetF[k];
    saveSettings();
  }
  sheetF = null; $('#sheet').hidden = true; $('#sheet').innerHTML = ''; render();
}
const countWith = f => deck.reduce((n, w) => n + (matches(w, f) ? 1 : 0), 0);
function chipHTML(k, i){
  const v = groups[k][i], on = sheetF[k].includes(v);
  const n = countWith({ ...sheetF, [k]: [v] });
  return `<button class="chip ${on ? 'on' : ''} ${n || on ? '' : 'zero'}" data-act="chip" data-k="${k}" data-i="${i}">${esc(v)}<i>${n}</i></button>`;
}
function renderSheet(resetScroll){
  const body = $('#sheetBody'), st = body.scrollTop;
  const axes = AXES.filter(([k]) => axisOn(k));
  $('#sheetTabs').innerHTML = axes.map(([k, l]) =>
    `<button data-act="sheet-axis" data-v="${k}" class="${k === sheetAxis ? 'on' : ''}">${l}${sheetF[k].length ? `（${sheetF[k].length}）` : ''}</button>`).join('');
  $('#sheetTabs').hidden = axes.length < 2;
  const k = sheetAxis;
  let html = '';
  if(k === 'cat'){
    html += `<div class="quick">${Object.keys(QUICK_NAMES).map(q => `<button data-act="quick" data-v="${q}">${QUICK_NAMES[q]}</button>`).join('')}</div>`;
    html += `<div class="chips">${groups.cat.map((_, i) => chipHTML('cat', i)).join('')}</div>`;
  }else if(k === 'topic' && axisOn('chap')){
    const byChap = new Map();
    for(const w of deck) if(w.topic){ const c = w.chap || ''; if(!byChap.has(c)) byChap.set(c, new Set()); byChap.get(c).add(w.topic); }
    html += '<div class="chips">';
    for(const [c, ts] of byChap){
      html += `<div class="chip-head">${esc(c || 'その他')}</div>`;
      for(const t of ts) html += chipHTML('topic', groups.topic.indexOf(t));
    }
    html += '</div>';
  }else{
    html += `<div class="chips">${groups[k].map((_, i) => chipHTML(k, i)).join('')}</div>`;
  }
  body.innerHTML = html;
  body.scrollTop = resetScroll ? 0 : st;
  const total = countWith(sheetF);
  const any = AXES.some(([a]) => sheetF[a].length);
  $('#sheetFoot').innerHTML = `<button class="btn primary" data-act="sheet-done" ${total ? '' : 'disabled'}>${!total ? '該当する用語がありません' : any ? `${total}語で決定` : `すべて（${total}語）で決定`}</button>`;
}

/* ---------- editing ---------- */
const csvCell = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
function deckToCSV(list){
  const rows = [['名称', '分類', '説明文', '章', 'トピック'], ...list.map(w => [w.name, w.cat, w.desc, w.chap, w.topic])];
  return rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
}
function persistDeck(){
  if(!store.set(K.custom, { label: deckLabel, text: deckToCSV(deck), edited: true })){ toast('保存できませんでした（容量不足の可能性があります）'); return false; }
  return true;
}
let edName = null;  // 編集中の用語の名称（新規はnull）
const opts = list => list.map(v => `<option value="${esc(v)}"></option>`).join('');
function topicsOf(chap){ const s = new Set(); for(const w of deck) if(w.topic && (!chap || w.chap === chap)) s.add(w.topic); return [...s]; }
function openEditor(name){
  const w = name ? deckMap.get(name) : null;
  if(name && !w) return;
  edName = w ? w.name : null;
  const base = w || { name:'', cat:'', desc:'', chap: settings.filter.chap.length === 1 ? settings.filter.chap[0] : '', topic: settings.filter.topic.length === 1 ? settings.filter.topic[0] : '' };
  const f = (k, label, extra = '') => `<label>${label}<input name="${k}" value="${esc(base[k] || '')}" autocomplete="off" ${extra}></label>`;
  $('#editor').innerHTML = `
  <div class="overlay" data-act="ed-bg"><div class="sheet" role="dialog" aria-label="${w ? '用語を編集' : '用語を追加'}">
    <div class="sheet-head"><h3>${w ? '用語を編集' : '用語を追加'}</h3><button data-act="ed-cancel">キャンセル</button></div>
    <form class="sheet-body ed" id="edForm" onsubmit="return false">
      ${f('name', '名称')}
      <label>説明文<textarea name="desc" rows="4">${esc(base.desc || '')}</textarea></label>
      ${f('cat', '分類', 'list="dl-cat"')}
      ${f('chap', '章', 'list="dl-chap"')}
      ${f('topic', 'トピック', 'list="dl-topic"')}
      <datalist id="dl-cat">${opts(groups.cat)}</datalist>
      <datalist id="dl-chap">${opts(groups.chap)}</datalist>
      <datalist id="dl-topic">${opts(topicsOf(base.chap))}</datalist>
      <p class="ed-err" id="edErr"></p>
      ${w ? `<p class="note" style="margin:0">名称を変えても、この用語の学習記録は引き継がれます。</p>` : ''}
    </form>
    <div class="sheet-foot ed-foot">${w ? '<button class="btn danger" data-act="ed-delete">削除</button>' : ''}<button class="btn primary" data-act="ed-save">保存</button></div>
  </div></div>`;
  $('#editor').hidden = false; document.body.style.overflow = 'hidden';
}
function closeEditor(changed){
  $('#editor').hidden = true; $('#editor').innerHTML = ''; edName = null;
  if(!S) document.body.style.overflow = '';
  if(!changed) return;
  if(S){ renderStudy(); return; }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}
function saveEditor(){
  const fd = new FormData($('#edForm'));
  const w = {}; for(const k of ['name', 'cat', 'desc', 'chap', 'topic']) w[k] = String(fd.get(k) || '').trim();
  const err = m => { $('#edErr').textContent = m; };
  if(!w.name) return err('名称を入力してください');
  if(!w.desc) return err('説明文を入力してください');
  if(w.name !== edName && deckMap.has(w.name)) return err('同じ名称の用語がすでにあります');
  w.cat = w.cat || '未分類';
  const old = edName;
  if(old){
    const i = deck.findIndex(x => x.name === old);
    deck[i] = w;
    if(w.name !== old){
      if(progress[old]){ progress[w.name] = progress[old]; delete progress[old]; saveProgress(); }
      if(S){ S.queue.forEach(c => { if(c.name === old) c.name = w.name; }); S.failed = S.failed.map(n => n === old ? w.name : n); S.history = []; }
    }
  }else{
    let at = -1;
    if(w.topic) deck.forEach((x, i) => { if(x.topic === w.topic) at = i; });
    if(at < 0 && w.chap) deck.forEach((x, i) => { if(x.chap === w.chap) at = i; });
    deck.splice(at < 0 ? deck.length : at + 1, 0, w);
  }
  setDeck(deck, deckLabel);
  if(!persistDeck()) return;
  saveSettings();
  toast(old ? '保存しました' : '追加しました');
  closeEditor(true);
}
function deleteEditor(){
  const name = edName; if(!name) return;
  if(!confirm(`「${name}」を削除しますか？`)) return;
  deck = deck.filter(x => x.name !== name);
  if(progress[name]){ delete progress[name]; saveProgress(); }
  if(S){ S.history = []; }
  setDeck(deck, deckLabel);
  if(!persistDeck()) return;
  saveSettings();
  toast('削除しました');
  closeEditor(true);
}

/* ---------- file share ---------- */
async function shareFile(file, title){
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCSV(){
  const file = new File(['\uFEFF' + deckToCSV(deck)], `clf-words-${ymd()}.csv`, { type:'text/csv' });
  shareFile(file, 'CLF単語帳 単語リスト');
}

/* ---------- backup ---------- */
function ymd(){ const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
async function exportBackup(){
  const data = { app:'clf-cards', version:VERSION, exportedAt:new Date().toISOString(), progress, settings, customDeck: store.get(K.custom, null) };
  const name = `clf-backup-${ymd()}.json`;
  const file = new File([JSON.stringify(data)], name, { type:'application/json' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'CLF単語帳 バックアップ' }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function readFile(input){
  return new Promise((ok, ng) => {
    const f = input.files && input.files[0]; if(!f) return ng(new Error('ファイルが選ばれていません'));
    const fr = new FileReader(); fr.onload = () => ok({ text: fr.result, name: f.name }); fr.onerror = () => ng(fr.error); fr.readAsText(f, 'utf-8');
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  switch(act){
    case 'tab': tab = v; window.scrollTo(0, 0); render(); break;
    case 'set': settings[t.dataset.k] = t.dataset.k === 'size' ? Number(v) : v; saveSettings(); render(); break;
    case 'start': startSession(plan(deck.filter(inScope), settings.size).picked); break;
    case 'grp-study': {
      const k = t.dataset.k, g = groups[k][Number(t.dataset.i)];
      startSession(plan(deck.filter(w => w[k] === g), settings.size).picked); break;
    }
    case 'cats-open': openSheet(); break;
    case 'sheet-bg': if(e.target === t) closeSheet(false); break;
    case 'sheet-clear': sheetF = emptyFilter(); renderSheet(); break;
    case 'sheet-done': closeSheet(true); break;
    case 'sheet-axis': sheetAxis = v; renderSheet(true); break;
    case 'quick': sheetF.cat = groups.cat.filter(QUICK[v]); renderSheet(); break;
    case 'chip': {
      const k = t.dataset.k, c = groups[k][Number(t.dataset.i)];
      sheetF[k] = sheetF[k].includes(c) ? sheetF[k].filter(x => x !== c) : [...sheetF[k], c];
      renderSheet(); break;
    }
    case 'list-st': listState.st = v; document.querySelectorAll('[data-act="list-st"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); renderListBody(); break;
    case 'reveal': if(S && !S.revealed){ S.revealed = true; renderStudy(); } break;
    case 'ok': answer(true); break;
    case 'ng': answer(false); break;
    case 'undo': undo(); break;
    case 'quit': endSession(); break;
    case 'finish': endSession(); break;
    case 'retry': { const ws = S.failed.map(n => deckMap.get(n)).filter(Boolean); startSession(ws); break; }
    case 'export': exportBackup(); break;
    case 'export-csv': exportCSV(); break;
    case 'ed-open': e.preventDefault(); e.stopPropagation(); openEditor(t.dataset.n || null); break;
    case 'ed-bg': if(e.target === t) closeEditor(false); break;
    case 'ed-cancel': closeEditor(false); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-delete': deleteEditor(); break;
    case 'reset-deck':
      if(confirm('内蔵の単語リストに戻しますか？アプリで編集・追加した内容は消えます（学習記録は残ります）。必要なら先に「CSVを書き出す」で保存してください。')){ store.del(K.custom); deck = []; loadDeck().then(() => { render(); toast('内蔵の単語リストに戻しました'); }); }
      break;
    case 'reset-progress':
      if(confirm('学習記録をすべて消去します。元に戻せません。よろしいですか？')){ progress = {}; saveProgress(); render(); toast('学習記録をリセットしました'); }
      break;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ listState.q = e.target.value; renderListBody(); }
  if(e.target.name === 'chap' && $('#dl-topic')){ $('#dl-topic').innerHTML = opts(topicsOf(e.target.value.trim())); }
});
document.addEventListener('change', async e => {
  const kind = e.target.dataset && e.target.dataset.file; if(!kind) return;
  try{
    const { text, name } = await readFile(e.target);
    if(kind === 'csv'){
      const list = csvToDeck(text);
      const label = name.replace(/\.(csv|txt)$/i, '');
      if(!store.set(K.custom, { label, text })) throw new Error('保存できませんでした（容量不足の可能性があります）');
      setDeck(list, label); saveSettings(); render(); toast(`${list.length}語を読み込みました`);
    }else{
      const data = JSON.parse(text);
      if(!data || data.app !== 'clf-cards' || typeof data.progress !== 'object') throw new Error('このアプリのバックアップではありません');
      if(!confirm('現在の学習記録を、バックアップの内容で置き換えます。よろしいですか？')) return;
      progress = data.progress || {}; saveProgress();
      if(data.settings) { settings = Object.assign(settings, data.settings); saveSettings(); }
      if(data.customDeck && data.customDeck.text){ store.set(K.custom, data.customDeck); }
      deck = []; await loadDeck(); render(); toast('バックアップから復元しました');
    }
  }catch(err){ toast(err && err.message ? err.message : '読み込みに失敗しました'); }
  finally{ e.target.value = ''; }
});
document.addEventListener('keydown', e => {
  if(!S || $('#study').hidden || !$('#editor').hidden || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(S.i >= S.queue.length) return;
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if(!S.revealed){ S.revealed = true; renderStudy(); } }
  else if(e.key === 'ArrowRight') answer(true);
  else if(e.key === 'ArrowLeft') answer(false);
  else if(e.key === 'Escape') endSession();
});

/* ---------- boot ---------- */
(async () => {
  await loadDeck();
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
})();
</script>
